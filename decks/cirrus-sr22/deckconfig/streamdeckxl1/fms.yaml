    text-font: B612Mono-Regular.ttf
    text-size: 16
    text-color: white
- index: 4
  name: GPS_GS_DTK
  activation:
    type: none
  representation:
    type: annunciator
    label: GS/DTK
    label-size: 9
    label-color: Gold
    annunciator:
      size: medium
      model: B
      parts:
      - text: ${sim/cockpit2/gauges/indicators/ground_speed_kt}kts
        text-format: '{0:.0f}'
        text-font: B612Mono-Regular.ttf
        text-size: 13
        color: white
        formula: '1'
      - text: ${sim/cockpit2/radios/indicators/gps_bearing_deg_mag}
        text-format: '{0:.0f}'
        text-font: B612Mono-Regular.ttf
        text-size: 13
        color: darkorange
        formula: '1'
