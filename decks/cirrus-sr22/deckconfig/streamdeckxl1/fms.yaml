name: fms
includes:
- includes/pagerfull
buttons:
- index: 0
  name: GPS_NAV_ID
  activation:
    type: none
  representation:
    type: text
    label: GPS
    label-size: 9
    label-color: Gold
    text: ${sim/cockpit2/radios/indicators/gps_nav_id}
    text-font: B612Mono-Regular.ttf
    text-size: 14
    text-color: deepskyblue
- index: 1
  name: GPS_DIST
  activation:
    type: none
  representation:
    type: text
    label: DIST
    label-size: 9
    label-color: Gold
    text: '${sim/cockpit2/radios/indicators/gps_dme_distance_nm}

      nm'
    text-format: '{0:.1f}'
    text-font: B612Mono-Regular.ttf
    text-size: 13
    text-color: white
- index: 2
  name: GPS_ETE
  activation:
    type: none
  representation:
    type: text
